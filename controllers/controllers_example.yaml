controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    # use_sim_time: true

    diff_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_controller:
  ros__parameters:
    publish_rate: 50.0

    # 4WD: two joints per side send to the controller.
    # diff_drive_controller sends the same velocity command
    # to FL & RL (left side) and FR & RR (right side).
    left_wheel_names:  ['fl_wheel_joint', 'rl_wheel_joint']
    right_wheel_names: ['fr_wheel_joint', 'rr_wheel_joint']

    # wheels_per_side: 2 #automatically detected by the lenght of the list
    wheel_separation: 0.205
    wheel_radius: 0.0508
    base_frame_id: base_footprint

    linear.x.has_velocity_limits: .NAN
    linear.x.has_acceleration_limits: .NAN
    linear.x.has_jerk_limits: .NAN
    linear.x.max_velocity: .NAN
    linear.x.min_velocity: .NAN
    linear.x.max_acceleration: .NAN
    linear.x.min_acceleration: .NAN
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.has_velocity_limits: .NAN
    angular.z.has_acceleration_limits: .NAN
    angular.z.has_jerk_limits: .NAN
    angular.z.max_velocity: .NAN
    angular.z.min_velocity: .NAN
    angular.z.max_acceleration: .NAN
    angular.z.min_acceleration: .NAN
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN

